name: volume

# ARTESP 공개 자료(SAT 일별 계수)에서 SP-308 / SP-330 계측점별 통행량(차량 대수)을 집계해 엑셀로 만든다.
# 공개 자료는 며칠 늦게 올라오므로 하루 한 번이면 충분하다. cron 은 UTC 기준 (10:30 UTC = 한국 19:30 = 브라질 07:30).
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 속도 수집(collect)·일일 보고와는 다른 그룹 — 서로 밀어내지 않도록. data 브랜치 푸시 충돌은 아래 재시도로 처리
concurrency:
  group: sp306-volume
  cancel-in-progress: false

jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure data branch
        run: bash scripts/ensure_data_branch.sh
        env:
          REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

      - uses: actions/checkout@v4
        with:
          ref: data
          path: store

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 통행량 집계는 엑셀 라이브러리만 필요 (그래프용 선택 패키지는 생략)
      - run: npm ci --omit=optional --no-audit --no-fund

      - name: Aggregate traffic volume
        run: node volume.js
        env:
          VOLUME_OUT: ${{ github.workspace }}/volume_out

      # 엑셀은 Actions 실행 화면 아래쪽 Artifacts 에서 내려받는다 (30일 보관)
      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: traffic-volume
          path: volume_out/traffic_volume_*.xlsx
          retention-days: 30
          if-no-files-found: error

      # 작은 요약 CSV 만 data 브랜치에 남겨 변화 이력을 확인할 수 있게 한다 (엑셀 자체는 커서 커밋하지 않음)
      - name: Commit summary
        working-directory: store
        run: |
          mkdir -p volume
          cp ../volume_out/summary_latest.csv volume/summary_latest.csv
          git config user.name  "sp306-bot"
          git config user.email "sp306-bot@users.noreply.github.com"
          git add volume/summary_latest.csv
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "volume summary $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin data && git push origin data && exit 0
            sleep $((i * 4))
          done
          echo "push 실패"; exit 1
