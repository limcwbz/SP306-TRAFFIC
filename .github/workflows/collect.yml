name: collect

# 15분마다 TomTom 에서 구간별(하행/상행) 속도를 조회해 data 브랜치에 누적한다. (cron 은 UTC 기준)
# 분을 3,18,33,48 로 둔 이유: 15분 슬롯 시작 3분 뒤에 실행되도록 해 GitHub 스케줄 지연(수 분)이 있어도 같은 슬롯에 기록되게 하고,
# 정각(:00/:30)에 몰리는 부하를 피하기 위해서다.
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 수집·보고가 같은 data 브랜치에 동시에 커밋하지 않도록 같은 그룹으로 직렬화
concurrency:
  group: sp306-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      # data 브랜치가 아직 없으면 seed/ 내용으로 자동 생성 (처음 한 번만 동작)
      - name: Ensure data branch
        run: bash scripts/ensure_data_branch.sh
        env:
          REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

      - uses: actions/checkout@v4
        with:
          ref: data
          path: store

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 수집 코드는 외부 패키지가 필요 없지만 lib.js 가 공용이므로 설치 (캐시되어 수 초)
      - run: npm ci --omit=optional --no-audit --no-fund

      - name: Collect
        run: node collect_run.js
        env:
          SP306_HOME: ${{ github.workspace }}/store
          # 밑줄 있는 이름(TOMTOM_API_KEY)과 없는 이름(TOMTOMAPIKEY) 둘 다 허용
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY || secrets.TOMTOMAPIKEY }}

      - name: Commit data
        if: always()
        working-directory: store
        run: |
          git config user.name  "sp306-bot"
          git config user.email "sp306-bot@users.noreply.github.com"
          git add -A data offsets.json state.json 2>/dev/null || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "collect $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin data && git push origin data && exit 0
            sleep $((i * 4))
          done
          echo "push 실패"; exit 1
